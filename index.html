<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Operativo - KOF</title>
    <style>
        :root {
            --kof-red: #F40000;
            --kof-dark-red: #C50000;
            --kof-black: #111111;
            --kof-gray: #F4F4F4;
            --kof-border: #E0E0E0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--kof-gray); color: var(--kof-black); padding-bottom: 40px; }
        header { background: linear-gradient(135deg, var(--kof-red), var(--kof-dark-red)); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--kof-border); border-radius: 8px; font-size: 1rem; background: #fafafa; }
        input:focus, select:focus { outline: none; border-color: var(--kof-red); background: white; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button.btn-primary { width: 100%; background: var(--kof-red); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        button.btn-primary:active { background: var(--kof-dark-red); }
        .history-item { padding: 12px; border-bottom: 1px solid var(--kof-border); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .history-item:last-child { border-bottom: none; }
        .history-info strong { display: block; color: var(--kof-black); font-size: 0.9rem; }
        .history-info span { color: #666; font-size: 0.8rem; }
        .badge { background: #ffebee; color: var(--kof-red); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }
        .empty-history { text-align: center; color: #888; font-size: 0.85rem; padding: 20px 0; }
    </style>
</head>
<body>

    <header>
        <h1>COCA-COLA FEMSA</h1>
        <p>Control Operativo Diario</p>
    </header>

    <div class="container">
        <div class="card">
            <form id="kofForm">
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="horaEntrada">Hora Entrada</label>
                        <input type="time" id="horaEntrada" required>
                    </div>
                    <div class="form-group">
                        <label for="horaSalida">Hora Salida</label>
                        <input type="time" id="horaSalida" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="cajasBajas">Cajas Bajas</label>
                        <input type="number" id="cajasBajas" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="cajasDevueltas">Cajas Devueltas</label>
                        <input type="number" id="cajasDevueltas" min="0" placeholder="0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="nroRuta">Número de Ruta</label>
                    <input type="text" id="nroRuta" placeholder="Ej. R-402" required>
                </div>
                <button type="submit" class="btn-primary">Guardar Registro</button>
            </form>
        </div>

        <div class="card">
            <h3 style="font-size: 1rem; margin-bottom: 12px; color: #333;">Historial en este Teléfono</h3>
            <div id="historyList">
                <div class="empty-history">No hay registros guardados aún.</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('fecha').valueAsDate = new Date();

        const form = document.getElementById('kofForm');
        const historyList = document.getElementById('historyList');

        function loadHistory() {
            const records = JSON.parse(localStorage.getItem('kof_records') || '[]');
            if (records.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No hay registros guardados aún.</div>';
                return;
            }
            historyList.innerHTML = '';
            records.forEach((rec, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-info">
                        <strong>Ruta: ${rec.nroRuta} (${rec.fecha})</strong>
                        <span>Entrada: ${rec.horaEntrada} | Salida: ${rec.horaSalida}</span>
                    </div>
                    <div>
                        <span class="badge">Bajas: ${rec.cajasBajas} | Dev: ${rec.cajasDevueltas}</span>
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newRecord = {
                fecha: document.getElementById('fecha').value,
                horaEntrada: document.getElementById('horaEntrada').value,
                horaSalida: document.getElementById('horaSalida').value,
                cajasBajas: document.getElementById('cajasBajas').value,
                cajasDevueltas: document.getElementById('cajasDevueltas').value,
                nroRuta: document.getElementById('nroRuta').value
            };

            const records = JSON.parse(localStorage.getItem('kof_records') || '[]');
            records.unshift(newRecord);
            localStorage.setItem('kof_records', JSON.stringify(records));

            form.reset();
            document.getElementById('fecha').valueAsDate = new Date();
            loadHistory();
            alert('¡Registro guardado con éxito!');
        });

        loadHistory();
    </script>
</body>
</html>
